plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
}

// Nimbus Gateway is an optional native component.  It is enabled by default
// on Windows (the supported runtime) and can be disabled with
// -Pnimbus.gateway.native=false; non-Windows development remains unaffected.
def gatewayNativeEnabled = providers.gradleProperty("nimbus.gateway.native")
        .map { it.toBoolean() }
        .orElse(org.gradle.internal.os.OperatingSystem.current().isWindows())
def gatewayBuildDir = layout.buildDirectory.dir("gateway-native")
def gatewayFallbackBuildDir = layout.buildDirectory.dir("gateway-msvc")
def gatewayResourceDir = layout.buildDirectory.dir("generated/resources/gateway")
def gatewayNativeStrict = providers.gradleProperty("nimbus.gateway.native.strict")
        .map { it.toBoolean() }
        .orElse(false)

tasks.register("buildGatewayNative") {
    group = "build"
    description = "Builds the Nimbus Gateway native bridge and host (Windows x64)."
    onlyIf { gatewayNativeEnabled.get() }
    inputs.dir(layout.projectDirectory.dir("gateway"))
    outputs.dir(gatewayResourceDir)
    doLast {
        if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            throw new GradleException("Nimbus Gateway native build requires Windows x64")
        }
        def cmake = System.getenv("CMAKE")
        if (cmake == null || cmake.isBlank()) {
            def bundled = file("D:/Microsoft Visual Studio/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe")
            cmake = bundled.isFile() ? bundled.absolutePath : "cmake"
        }
        def vcvars = file("D:/Microsoft Visual Studio/VC/Auxiliary/Build/vcvars64.bat")
        def ninja = file("D:/Microsoft Visual Studio/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe")
        def buildDir = gatewayBuildDir.get().asFile
        def configureArgs = [cmake, "-S", file("gateway").absolutePath,
                             "-B", buildDir.absolutePath, "-G", "Ninja",
                             "-DCMAKE_BUILD_TYPE=Release"]
        if (ninja.isFile()) configureArgs += "-DCMAKE_MAKE_PROGRAM=${ninja.absolutePath}"
        def runNative = { List args ->
            List<String> commandLine
            if (vcvars.isFile()) {
                def command = "call \"${vcvars.absolutePath}\" >nul && " +
                        args.collect { "\"${it}\"" }.join(" ")
                commandLine = ["cmd.exe", "/d", "/c", command.toString()]
            } else {
                commandLine = args.collect { it.toString() }
            }
            def process = new ProcessBuilder(commandLine)
                    .directory(project.projectDir)
                    .redirectErrorStream(true)
                    .start()
            process.inputStream.withReader("UTF-8") { reader ->
                reader.eachLine { logger.lifecycle(it) }
            }
            int exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("Nimbus Gateway native command failed with code ${exitCode}")
            }
        }
        runNative(configureArgs)
        runNative([cmake, "--build", buildDir.absolutePath, "--config", "Release"])
        def resources = gatewayResourceDir.get().asFile
        resources.mkdirs()
        ["nimbus-gateway-bridge.dll", "nimbus-gateway-host.exe"].each { name ->
            // Some endpoint-security tools quarantine the bridge immediately after
            // CMake links it.  Prefer the current build, then the previously
            // generated MSVC build, and never copy a zero-byte placeholder.
            def candidates = [
                    file("${buildDir.absolutePath}/${name}"),
                    file("${gatewayFallbackBuildDir.get().asFile.absolutePath}/${name}"),
                    file("${buildDir.absolutePath}/Release/${name}"),
                    file("${gatewayFallbackBuildDir.get().asFile.absolutePath}/Release/${name}")
            ]
            def built = candidates.find { it.isFile() && it.length() > 0 }
            def destination = file("${resources.absolutePath}/${name}")
            if (built == null) {
                if (destination.isFile() && destination.length() == 0) destination.delete()
                def message = "Nimbus Gateway native output unavailable for ${name}; antivirus may have quarantined it"
                if (gatewayNativeStrict.get()) throw new GradleException(message)
                logger.warn(message)
                return
            }
            try {
                java.nio.file.Files.copy(
                        built.toPath(),
                        destination.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            } catch (IOException copyError) {
                // If security software removes the file between discovery and
                // copy, leave the resource absent rather than producing a
                // misleading zero-byte entry in the jar.
                if (destination.isFile() && destination.length() == 0) destination.delete()
                def message = "Nimbus Gateway output ${name} could not be copied; antivirus may have quarantined it"
                if (gatewayNativeStrict.get()) throw new GradleException(message, copyError)
                logger.warn(message)
            }
        }
    }
}

tasks.named("jar") {
    dependsOn(tasks.named("buildGatewayNative"))
    from(gatewayResourceDir) {
        into "nimbus/gateway"
        include "*.dll", "*.exe"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("io.github.humbleui:skija-shared:${project.skija_version}")
    implementation include("io.github.humbleui:types:${project.humbleui_types_version}")
    runtimeOnly include("io.github.humbleui:skija-windows-x64:${project.skija_version}")

    implementation include("javazoom:jlayer:${project.jlayer_version}")
    implementation include("org.jflac:jflac-codec:${project.jflac_version}")
    implementation include("io.nayuki:qrcodegen:${project.qrcodegen_version}")

    // Minecraft 1.20.1 already ships JNA. Nimbus Gateway uses jna-platform's
    // Windows DPAPI binding so NetEase session secrets are never stored in plaintext.
    implementation "net.java.dev.jna:jna-platform:5.12.1"
    implementation include("org.apache.commons:commons-compress:${project.commons_compress_version}")
    implementation include("org.tukaani:xz:${project.xz_version}")

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    inputs.property "java_version", project.java_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version,
                "java_version": project.java_version
    }

    from("src/main/resources/assets/nimbus/background") {
        include "26.10_panorama_hdr_*.png"
        eachFile {
            name = name.replaceFirst("26\\.10_panorama_hdr_", "panorama_")
        }
        into "assets/minecraft/textures/gui/title/background"
    }
}

def targetJavaVersion = Integer.parseInt(project.java_version)
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("README.md")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
