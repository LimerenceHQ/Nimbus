plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("io.github.humbleui:skija-shared:${project.skija_version}")
    implementation include("io.github.humbleui:types:${project.humbleui_types_version}")
    runtimeOnly include("io.github.humbleui:skija-windows-x64:${project.skija_version}")

    implementation include("javazoom:jlayer:${project.jlayer_version}")
    implementation include("org.jflac:jflac-codec:${project.jflac_version}")
    implementation include("io.nayuki:qrcodegen:${project.qrcodegen_version}")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    inputs.property "java_version", project.java_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version,
                "java_version": project.java_version
    }

    from("src/main/resources/assets/nimbus/background") {
        include "26.10_panorama_hdr_*.png"
        eachFile {
            name = name.replaceFirst("26\\.10_panorama_hdr_", "panorama_")
        }
        into "assets/minecraft/textures/gui/title/background"
    }
}

def targetJavaVersion = Integer.parseInt(project.java_version)
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}



def nativeBuild = layout.buildDirectory.dir('native/proxy')
def nativeResources = layout.buildDirectory.dir('generated/nativeProxy')
def windowsHost = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).startsWith('windows')
def bundleNativeProxy = providers.gradleProperty('bundleNativeProxy').map { it.toBoolean() }.getOrElse(windowsHost)
def cmakeCommand = providers.gradleProperty('cmakeExecutable').orElse(providers.provider {
    if (windowsHost) {
        def installer = new File(System.getenv('ProgramFiles(x86)') ?: 'C:/Program Files (x86)',
                'Microsoft Visual Studio/Installer/vswhere.exe')
        if (installer.isFile()) {
            def installation = providers.exec {
                commandLine installer.absolutePath, '-latest', '-products', '*',
                        '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-property', 'installationPath'
            }.standardOutput.asText.get().trim()
            def bundled = new File(installation, 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe')
            if (bundled.isFile()) return bundled.absolutePath
        }
    }
    return 'cmake'
})

tasks.register('configureNativeProxy', Exec) {
    group = 'native'
    inputs.file('native/proxy/CMakeLists.txt')
    outputs.file(nativeBuild.map { it.file('CMakeCache.txt') })
    doFirst {
        commandLine cmakeCommand.get(), '-S', file('native/proxy').absolutePath,
                '-B', nativeBuild.get().asFile.absolutePath, '-A', 'x64'
    }
}

tasks.register('buildNativeProxy', Exec) {
    group = 'native'
    description = 'Builds the Windows x64 A-side nimbus_proxy agent.'
    dependsOn 'configureNativeProxy'
    inputs.files(fileTree('native/proxy') { include '**/*.cpp', '**/*.h', 'CMakeLists.txt' })
    outputs.file(nativeBuild.map { it.file('Release/nimbus_proxy.dll') })
    doFirst {
        commandLine cmakeCommand.get(), '--build', nativeBuild.get().asFile.absolutePath,
                '--config', 'Release', '--parallel', '2'
    }
}

tasks.register('packageNativeProxy', Sync) {
    group = 'native'
    description = 'Stages the A-side agent in generated jar resources, not source resources.'
    dependsOn 'buildNativeProxy'
    from(nativeBuild.map { it.file('Release/nimbus_proxy.dll') }) {
        into 'assets/nimbus/native/windows-x86_64'
    }
    into nativeResources
    doFirst {
        if (!nativeBuild.get().file('Release/nimbus_proxy.dll').asFile.isFile())
            throw new GradleException('A-side nimbus_proxy.dll is missing after native build')
    }
}

if (bundleNativeProxy) {
    sourceSets.main.resources.srcDir(tasks.named('packageNativeProxy'))
}

tasks.named('sourcesJar', Jar) {
    exclude 'assets/nimbus/native/**/*.dll'
}

def nativeControllerBuild = layout.buildDirectory.dir('native/controller')
def nativeControllerResources = layout.buildDirectory.dir('generated/nativeController')
tasks.register('configureNativeController', Exec) {
    group = 'native'
    inputs.file('native/controller/CMakeLists.txt')
    outputs.file(nativeControllerBuild.map { it.file('CMakeCache.txt') })
    doFirst { commandLine cmakeCommand.get(), '-S', file('native/controller').absolutePath, '-B', nativeControllerBuild.get().asFile.absolutePath, '-A', 'x64' }
}
tasks.register('buildNativeController', Exec) {
    group = 'native'
    description = 'Builds the Nimbus-side Windows x64 process scanner.'
    dependsOn 'configureNativeController'
    inputs.files(fileTree('native/controller') { include '**/*.cpp', '**/*.h', 'CMakeLists.txt' })
    outputs.file(nativeControllerBuild.map { it.file('Release/nimbus_controller.dll') })
    doFirst { commandLine cmakeCommand.get(), '--build', nativeControllerBuild.get().asFile.absolutePath, '--config', 'Release', '--parallel', '2' }
}
tasks.register('packageNativeController', Sync) {
    group = 'native'
    description = 'Stages the Nimbus-side process scanner in generated jar resources.'
    dependsOn 'buildNativeController'
    from(nativeControllerBuild.map { it.file('Release/nimbus_controller.dll') }) { into 'assets/nimbus/native/windows-x86_64' }
    into nativeControllerResources
    doFirst { if (!nativeControllerBuild.get().file('Release/nimbus_controller.dll').asFile.isFile()) throw new GradleException('Nimbus controller DLL is missing after native build') }
}
if (bundleNativeProxy) { sourceSets.main.resources.srcDir(tasks.named('packageNativeController')) }

sourceSets { proxyHelper { java.srcDir 'src/proxyHelper/java' } }
tasks.register('proxyHelperJar',Jar) {
    dependsOn 'proxyHelperClasses'
    archiveFileName='nimbus_attach_helper.jar'
    destinationDirectory=layout.buildDirectory.dir('proxy-helper')
    from sourceSets.proxyHelper.output
    manifest { attributes 'Main-Class':'cc.nimbus.proxyhelper.AttachHelper' }
}
tasks.register('packageProxyHelper',Sync) {
    dependsOn 'proxyHelperJar'
    from(tasks.named('proxyHelperJar')) { into 'assets/nimbus/native/windows-x86_64' }
    into layout.buildDirectory.dir('generated/proxyHelper')
}
if(bundleNativeProxy) { sourceSets.main.resources.srcDir(tasks.named('packageProxyHelper')) }
